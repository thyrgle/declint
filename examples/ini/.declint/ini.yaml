# INI rules — everything from doc/tutorial.md parts 2-5.

version: 1
languages: [ini]
rules:
  - id: no-tabs
    pattern: '\t+'
    message: "Tab character — use spaces"
    severity: warning

  - id: empty-value
    pattern: '(?m)^\s*(?<key>[\w-]+)[ \t]*=[ \t]*$'
    message: "'{key}' has no value"
    severity: warning

  - id: kebab-case-keys
    pattern: '(?m)^\s*(?<key>[\w-]+)[ \t]*='
    severity: warning
    callback: |
      return function(c)
        local key = c.captures.key
        if key == key:lower() then return nil end
        if key == "mySQL" then return nil end
        return { message = "key '" .. key .. "' should be kebab-case" }
      end

  # A parser rule: regex rules can't count, so duplicate keys need a
  # function that sees the whole file at once.
  - id: duplicate-keys
    parser: |
      return function(text, offset)
        local seen, matches = {}, {}
        local pos = 1
        while pos <= #text do
          local nl = text:find("\n", pos, true) or (#text + 1)
          local line = text:sub(pos, nl - 1)
          local key = line:match("^%s*([%w-]+)%s*=")
          if key and seen[key] then
            matches[#matches + 1] = {
              start = offset + pos - 1, finish = offset + pos - 1 + #line,
              captures = { key = key, count = tostring(seen[key] + 1) },
            }
          end
          if key then seen[key] = (seen[key] or 0) + 1 end
          pos = nl + 1
        end
        return matches
      end
    message: "'{key}' defined {count} times"
    severity: error

scopes:
  # Rules for [server] sections: the port must parse as a number in
  # 1-65535. The region spans from the [server] header to the next
  # section header (or end of file).
  - id: server
    start: '^\[server\]$'
    end: '^\['
    rules:
      - id: port-range
        pattern: '(?m)^\s*port[ \t]*=[ \t]*(?<port>\S+)'
        severity: error
        callback: |
          return function(c)
            local n = tonumber(c.captures.port)
            if n == nil then
              return { message = "port must be a number, found '" .. c.captures.port .. "'" }
            end
            if n < 1 or n > 65535 then
              return { message = "port must be 1-65535, found " .. n }
            end
            return nil
          end
