[package]
name = "ezlint-lua"
version = "0.4.0"
edition = "2021"
description = "Lua match callbacks for ezlint: inline snippets and .lua files, compiled and sandboxed."
license = "MIT OR Apache-2.0"
keywords = ["lint", "lua", "callback", "sandbox"]
categories = ["development-tools"]

[dependencies]
ezlint-core = { path = "../ezlint-core", version = "0.4.0" }
mlua = { version = "0.12", features = ["lua54", "send", "vendored"] }
