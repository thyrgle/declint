[package]
name = "ezlint-core"
version = "0.2.0"
edition = "2021"
description = "Config and regex linting engine for ezlint: YAML rule files, message templates, violations. No LSP dependencies."
license = "MIT OR Apache-2.0"
keywords = ["lint", "linter", "regex", "config"]
categories = ["development-tools", "parsing"]

[dependencies]
regex = "1"
serde_yaml = "0.9"
