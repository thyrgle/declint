[package]
name = "declint"
version = "0.8.0"
edition = "2021"
description = "A YAML-configured regex linter and language server: `declint serve` in your editor, `declint check` in CI."
license = "MIT OR Apache-2.0"
repository = "https://github.com/thyrgle/declint"
readme = "../../README.md"
keywords = ["lint", "linter", "cli", "lsp"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
declint-core = { path = "../declint-core", version = "0.8.0" }
declint-lsp = { path = "../declint-lsp", version = "0.8.0" }
declint-lua = { path = "../declint-lua", version = "0.8.0" }
ignore = "0.4"
serde_yaml = "0.9"
ureq = "2"

[dev-dependencies]
serde_json = "1"
