[package]
name = "ezlint-lsp"
version = "0.2.0"
edition = "2021"
description = "LSP server for ezlint: publishes regex rule violations as diagnostics via increparse-lsp."
license = "MIT OR Apache-2.0"
keywords = ["lint", "lsp", "language-server", "diagnostics"]
categories = ["development-tools"]

[dependencies]
ezlint-core = { path = "../ezlint-core", version = "0.2.0" }
increparse = { path = "../../../increparse/crates/increparse", version = "0.1.0" }
increparse-lsp = { path = "../../../increparse/crates/increparse-lsp", version = "0.1.0" }
lsp-types = "0.97"
